<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaLineOS</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/css/winbox.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
    <script defer src="./js/storage.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/apps.js"></script>
    <script defer src="./js/desktop.js"></script>
    <script defer src="./js/main.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <section id="boot-screen" class="screen boot-screen active">
        <div class="boot-orb"></div>
        <div class="boot-brand">
          <div class="logo">N</div>
          <div>
            <h1>NexaLineOS</h1>
            <p>Booting system core</p>
          </div>
        </div>
        <div class="boot-bar"><span id="boot-progress"></span></div>
        <div id="boot-status" class="boot-status">Initializing secure shell...</div>
      </section>

      <section id="login-screen" class="screen login-screen">
        <div class="glass-card login-card">
          <div class="brand">
            <div class="logo large">N</div>
            <div>
              <h2>NexaLineOS</h2>
              <p>Sign in to continue</p>
            </div>
          </div>

          <form id="login-form" class="login-form">
            <label>
              <span>用户名</span>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" />
            </label>
            <label>
              <span>密码</span>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
            </label>
            <button type="submit" class="primary-btn">登录 NexaLineOS</button>
          </form>

          <div id="login-message" class="login-message"></div>
          <button id="open-user-btn" type="button" class="open-user-btn">开放用户名单</button>
        </div>
      </section>

      <section id="desktop-screen" class="screen desktop-screen">
        <div class="desktop-wallpaper"></div>
        <div class="topbar glass-bar">
          <div class="sys-title">
            <span class="dot"></span>
            <span>NexaLineOS</span>
          </div>
          <div id="clock" class="clock"></div>
        </div>

        <main class="desktop-stage">
          <div id="desktop-icons" class="desktop-icons"></div>
        </main>

        <button id="import-app-btn" class="import-fab" type="button">导入</button>

        <footer class="taskbar glass-bar">
          <button id="start-btn" class="start-btn" type="button">N</button>
          <div id="task-items" class="task-items"></div>
          <div id="taskbar-clock" class="taskbar-clock"></div>
        </footer>
      </section>

      <div id="start-menu" class="start-menu hidden" aria-hidden="true">
        <button type="button" data-action="logout">注销</button>
        <button type="button" data-action="restart">重启</button>
        <button type="button" data-action="shutdown">关机</button>
      </div>

      <div id="context-menu" class="context-menu hidden" aria-hidden="true"></div>

      <div id="shutdown-screen" class="shutdown-screen hidden" aria-hidden="true">
        <div class="shutdown-core">
          <div class="logo large">N</div>
          <p id="shutdown-text">正在关机...</p>
        </div>
      </div>

      <div id="import-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-card glass-card">
          <h3>导入应用</h3>
          <p>输入一个网页 URL，系统会保存配置并在桌面生成图标。</p>
          <form id="import-form" class="import-form">
            <input id="app-url" type="url" placeholder="https://example.com" required />
            <div class="modal-actions">
              <button id="cancel-import" type="button" class="ghost-btn">取消</button>
              <button type="submit" class="primary-btn">导入并保存</button>
            </div>
          </form>
        </div>
      </div>

      <div id="open-user-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-card glass-card open-user-card">
          <div class="open-user-head">
            <h3>开放用户名单</h3>
            <button id="close-open-user" type="button" class="ghost-btn">关闭</button>
          </div>
          <div id="open-user-list" class="open-user-list"></div>
        </div>
      </div>
    </div>
  </body>
</html>
